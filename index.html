<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEST</title>
<meta name="description" content="BEST — творческое сообщество каверов и клипов.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070502">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Marck+Script&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070502; --parchment:#cdc2a8; --gold-dim:#8a651f;
    --word-c1:#fff8d0; --word-c2:#fff1a8; --word-c3:#ffc928; --word-c4:#d99a00; --word-c5:#8a4e00;
    --word-glow1: rgba(255,241,168,0.9); --word-glow2: rgba(255,201,40,0.55); --word-glow3: rgba(217,154,0,0.4);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; background:var(--ink); }
  body{ color:var(--parchment); font-family:ui-sans-serif,system-ui,sans-serif; }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:0.001ms !important; } }

  #app{ position:relative; height:100svh; width:100%; overflow:hidden; }
  .tor-wrap{
    position:absolute; left:50%; top:50%; z-index:0;
    width:min(120vw,120vh); height:min(120vw,120vh);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  canvas.tor-canvas{ width:100%; height:100%; }

  .screen{
    position:absolute; inset:0; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    padding:1.6rem; text-align:center;
  }
  .screen-inner{ position:relative; z-index:2; width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:1.1rem; }

  .logo-stack{ position:relative; display:inline-block; cursor:pointer; }
  #wordmark{
    position:relative; margin:0;
    transition: opacity 0.16s ease; /* fix «квадраты выскакивают» — плавная смена текста при тапе */
    font-family:"Alex Brush", "Marck Script", "Pinyon Script", "Segoe Script", "Brush Script MT", cursive;
    font-weight:400; font-size:clamp(var(--wm-min, 5.4rem), 28vw, var(--wm-max, 12rem)); line-height:1;
    background:linear-gradient(160deg, var(--word-c1) 0%, var(--word-c2) 22%, var(--word-c3) 46%, var(--word-c4) 70%, var(--word-c5) 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    -webkit-text-stroke: 0.6px rgba(90,50,0,0.45);
    filter:
      drop-shadow(0 0 3px var(--word-glow1))
      drop-shadow(0 0 16px var(--word-glow2))
      drop-shadow(0 0 34px var(--word-glow3))
      drop-shadow(0 2px 0 rgba(59,33,0,0.65));
    animation: glow-pulse 3.6s ease-in-out infinite;
  }
  #wordmark::after{
    content: attr(data-text);
    position:absolute; inset:0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.95) 48%, rgba(255,255,255,0.95) 52%, transparent 70%);
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    animation: mirror-sweep 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes mirror-sweep{ 0%{ background-position:150% 0; } 55%,100%{ background-position:-50% 0; } }
  @keyframes glow-pulse{
    0%,100%{ filter:
      drop-shadow(0 0 3px rgba(255,241,168,0.9)) drop-shadow(0 0 16px rgba(255,201,40,0.55))
      drop-shadow(0 0 34px rgba(217,154,0,0.4)) drop-shadow(0 2px 0 rgba(59,33,0,0.65)); }
    50%{ filter:
      drop-shadow(0 0 4px rgba(255,241,168,1)) drop-shadow(0 0 24px rgba(255,201,40,0.75))
      drop-shadow(0 0 46px rgba(217,154,0,0.55)) drop-shadow(0 2px 0 rgba(59,33,0,0.65)); }
  }
  @supports not (background-clip: text){
    #wordmark{ color:#ffc928; -webkit-text-fill-color:#ffc928; background:none; }
  }
  .logo-spark{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:#fff8d0; box-shadow:0 0 8px 2px rgba(255,201,40,0.8);
    animation: spark-twinkle 2.4s ease-in-out infinite;
  }
  .logo-spark:nth-child(2){ top:6%; right:8%; animation-delay:0s; }
  .logo-spark:nth-child(3){ bottom:14%; left:4%; animation-delay:0.8s; }
  .logo-spark:nth-child(4){ top:44%; right:-2%; width:4px; height:4px; animation-delay:1.5s; }
  @keyframes spark-twinkle{ 0%,100%{ opacity:0; transform:scale(0.4); } 50%{ opacity:1; transform:scale(1); } }
  @media (prefers-reduced-motion: reduce){
    #wordmark, #wordmark::after{ animation:none; }
    .logo-spark{ animation:none; opacity:0; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="tor-wrap" aria-hidden="true"><canvas class="tor-canvas" id="torCanvas"></canvas></div>
  <div class="screen">
    <div class="screen-inner">
      <div class="logo-stack" id="logoStack">
        <h1 id="wordmark" data-text="Hit.parad.official">Hit.parad.official</h1>
        <span class="logo-spark" aria-hidden="true"></span>
        <span class="logo-spark" aria-hidden="true"></span>
        <span class="logo-spark" aria-hidden="true"></span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function seeded(i){ var x = Math.sin(i*12.9898)*43758.5453; return x - Math.floor(x); }

  var torCanvas = document.getElementById('torCanvas');
  var tctx = torCanvas.getContext('2d');
  var tw, th, tdpr = Math.min(window.devicePixelRatio || 1, 2);
  function torResize(){
    tw = torCanvas.parentElement.clientWidth; th = torCanvas.parentElement.clientHeight;
    torCanvas.width = tw*tdpr; torCanvas.height = th*tdpr;
    torCanvas.style.width = tw+'px'; torCanvas.style.height = th+'px';
    tctx.setTransform(tdpr,0,0,tdpr,0,0);
  }
  window.addEventListener('resize', torResize);
  torResize();

  // 6 подтверждённых направлений (то же множество, что в приватном Пульте на данный момент) —
  // тап по слову переключает по кругу в этом порядке
  var VARIANTS = [
    { word:'Hit.parad.official', ring:{ core:'242,240,222', bright:'249,232,118', gold:'253,223,33', amber:'211,184,9', amberDark:'142,125,11', bronze:'65,58,11' } },
    { word:'Valmont', ring:{ core:'255,225,215', bright:'255,90,90', gold:'230,25,25', amber:'178,14,14', amberDark:'120,8,8', bronze:'50,3,3' } },
    { word:'Animix', ring:{ core:'230,222,242', bright:'173,118,249', gold:'124,33,253', amber:'93,9,211', amberDark:'66,11,142', bronze:'34,11,65' } },
    { word:'Aleorix', ring:{ core:'242,222,232', bright:'249,118,184', gold:'253,33,143', amber:'211,9,110', amberDark:'142,11,77', bronze:'65,11,38' } },
    { word:'Jelly', ring:{ core:'255,230,150', bright:'224,178,80', gold:'184,134,11', amber:'139,101,8', amberDark:'92,64,5', bronze:'40,28,2' } },
    { word:'BestOfficial', ring:{ core:'255,244,176', bright:'255,216,74', gold:'255,179,0', amber:'242,138,0', amberDark:'185,90,0', bronze:'90,38,0' } }
  ];
  var GT = { core:'', bright:'', gold:'', amber:'', amberDark:'', bronze:'' };
  var variantIndex = 0;
  // размер шрифта считается по длине слова — «Hit.parad.official» (19 букв) иначе вылезает
  // далеко за кольцо, если использовать тот же максимум, что и «Jelly» (5 букв)
  function torSizeWordmark(text){
    var len = Math.max(String(text).length, 1);
    var f = Math.pow(4/len, 0.7);
    var minRem = Math.max(1.6, 5.4*f), maxRem = Math.max(minRem+0.4, 12*f);
    var wm = document.getElementById('wordmark');
    wm.style.setProperty('--wm-min', minRem.toFixed(2)+'rem');
    wm.style.setProperty('--wm-max', maxRem.toFixed(2)+'rem');
  }
  // «квадраты/блоки выскакивают при тапе» — смена textContent на элементе с background-clip:text
  // может на один кадр показать непрорезанный прямоугольник градиента, пока браузер не
  // пересчитает клип под новую форму текста. Фикс: гасим слово перед сменой, меняем всё, пока
  // невидимо, затем плавно проявляем — артефакт физически не успевает попасть в кадр.
  var torSwapTimer = null;
  function applyVariant(i){
    var wm = document.getElementById('wordmark');
    wm.style.opacity = '0';
    clearTimeout(torSwapTimer);
    torSwapTimer = setTimeout(function(){
      variantIndex = ((i % VARIANTS.length) + VARIANTS.length) % VARIANTS.length;
      var v = VARIANTS[variantIndex];
      GT.core=v.ring.core; GT.bright=v.ring.bright; GT.gold=v.ring.gold;
      GT.amber=v.ring.amber; GT.amberDark=v.ring.amberDark; GT.bronze=v.ring.bronze;
      wm.textContent = v.word; wm.setAttribute('data-text', v.word);
      torSizeWordmark(v.word);
      wm.style.opacity = '1';
    }, 160);
  }
  applyVariant(0);
  document.getElementById('logoStack').addEventListener('click', function(){
    applyVariant(variantIndex + 1);
  });

  var torStrands = [];
  var STRAND_N = 14;
  for(var si=0; si<STRAND_N; si++){
    var spread = si/(STRAND_N-1);
    torStrands.push({
      pos: 0.5 + (spread - 0.5) * 0.68,
      freq: 3 + Math.floor(seeded(si+7)*3),
      wob: 0.07 + seeded(si+13)*0.11,
      phase: seeded(si+21)*Math.PI*2,
      width: 2.3 + seeded(si+29)*3.8,
      alpha: 0.56 + seeded(si+37)*0.40,
      colorStep: si
    });
  }
  function torStrandColor(step){
    var stops = [GT.core, GT.bright, GT.gold, GT.amber, GT.amberDark, GT.bronze, GT.bronze];
    return stops[step % stops.length];
  }

  var torWisps = [];
  var torWispN = reduced ? 0 : 10;
  for(var wi=0; wi<torWispN; wi++){
    torWisps.push({ angle: seeded(wi+51)*Math.PI*2, len: 0.10+seeded(wi+59)*0.16, curve: 0.4+seeded(wi+67)*0.5, speed: 0.00004+seeded(wi+73)*0.00006 });
  }

  var torSparks = [];
  var torSparkN = reduced ? 0 : 64;
  for(var k=0;k<torSparkN;k++){
    torSparks.push({ a: seeded(k*3+1)*Math.PI*2, rOff: seeded(k*3+2), speed: 0.0006+seeded(k*3+3)*0.0009, tw: seeded(k*3+4)*Math.PI*2, size: 2.6+seeded(k*3+5)*3.2, flare: (k%8===0) });
  }

  function torDraw(t){
    tctx.clearRect(0,0,tw,th);
    var cx=tw/2, cy=th/2, minDim = Math.min(tw,th);
    var outerR = minDim*0.40, innerR = outerR*0.55;
    var bandHalf = (outerR-innerR)/2;
    var rotT = t*0.00031;

    var blx = cx - outerR*0.30, bly = cy - outerR*0.40;
    var bloom = tctx.createRadialGradient(blx,bly,0, blx,bly, outerR*0.55);
    bloom.addColorStop(0,'rgba('+GT.core+',0.38)'); bloom.addColorStop(1,'rgba('+GT.core+',0)');
    tctx.fillStyle = bloom; tctx.beginPath(); tctx.arc(blx,bly,outerR*0.55,0,Math.PI*2); tctx.fill();

    // тонкая идеальная ось-окружность на среднем радиусе, вокруг которой кружатся волны
    tctx.save();
    tctx.strokeStyle = 'rgba('+GT.bright+',0.16)';
    tctx.lineWidth = 1.1;
    tctx.beginPath();
    tctx.arc(cx, cy, innerR+bandHalf, 0, Math.PI*2);
    tctx.stroke();
    tctx.restore();

    torStrands.forEach(function(s){
      var segs = 110;
      var r0 = innerR + bandHalf*2*s.pos;
      tctx.beginPath();
      for(var seg=0; seg<=segs; seg++){
        var ang = (seg/segs)*Math.PI*2;
        var wob = Math.sin(ang*s.freq + s.phase + rotT) * bandHalf * s.wob;
        var r = r0 + wob;
        var x = cx + Math.cos(ang)*r, y = cy + Math.sin(ang)*r*0.985;
        if(seg===0) tctx.moveTo(x,y); else tctx.lineTo(x,y);
      }
      tctx.save();
      tctx.shadowColor = 'rgba('+GT.bright+',0.55)';
      tctx.shadowBlur = 3;
      tctx.strokeStyle = 'rgba('+torStrandColor(s.colorStep)+','+(s.alpha*0.35).toFixed(3)+')';
      tctx.lineWidth = s.width*3.2;
      tctx.stroke();
      tctx.restore();

      tctx.save();
      tctx.globalCompositeOperation = 'lighter';
      tctx.shadowColor = 'rgba('+GT.bright+',0.9)';
      tctx.shadowBlur = 17;
      tctx.strokeStyle = 'rgba('+torStrandColor(s.colorStep)+','+s.alpha+')';
      tctx.lineWidth = s.width;
      tctx.stroke();
      tctx.restore();

      var shine = 0.10 + 0.22*Math.max(0, Math.sin(t*0.0009 + s.phase*1.7));
      tctx.save();
      tctx.shadowColor = 'rgba('+GT.core+',0.95)';
      tctx.shadowBlur = 10;
      tctx.strokeStyle = 'rgba('+GT.core+','+shine.toFixed(3)+')';
      tctx.lineWidth = s.width*0.45;
      tctx.stroke();
      tctx.restore();
    });

    torWisps.forEach(function(wsp){
      var ang = wsp.angle + t*wsp.speed;
      var r0 = outerR*0.99, r1 = outerR*(1+wsp.len), ang1 = ang + wsp.curve;
      var x0 = cx+Math.cos(ang)*r0, y0 = cy+Math.sin(ang)*r0*0.985;
      var x1 = cx+Math.cos(ang1)*r1, y1 = cy+Math.sin(ang1)*r1*0.985;
      var midAng=(ang+ang1)/2, midR=(r0+r1)/2*1.04;
      var mx=cx+Math.cos(midAng)*midR, my=cy+Math.sin(midAng)*midR*0.985;
      var grad = tctx.createLinearGradient(x0,y0,x1,y1);
      grad.addColorStop(0,'rgba('+GT.bright+',0.4)'); grad.addColorStop(1,'rgba('+GT.bright+',0)');
      tctx.beginPath(); tctx.moveTo(x0,y0); tctx.quadraticCurveTo(mx,my,x1,y1);
      tctx.strokeStyle = grad; tctx.lineWidth = 1.1; tctx.stroke();
    });

    torSparks.forEach(function(sp){
      sp.a += sp.speed;
      var r = innerR + bandHalf*2*sp.rOff;
      var x = cx+Math.cos(sp.a)*r, y = cy+Math.sin(sp.a)*r*0.98;
      var op = 0.48 + 0.52*Math.max(0, Math.sin(t*0.0016 + sp.tw));
      var sz = sp.flare ? sp.size*1.8 : sp.size;

      var trailN = 4;
      for(var ti=trailN; ti>=1; ti--){
        var ta = sp.a - sp.speed*ti*3.4;
        var tx = cx+Math.cos(ta)*r, ty = cy+Math.sin(ta)*r*0.98;
        var talpha = op * (1 - ti/(trailN+1)) * 0.4;
        tctx.beginPath(); tctx.fillStyle = 'rgba('+GT.bright+','+talpha.toFixed(3)+')';
        tctx.arc(tx, ty, sz*0.42, 0, Math.PI*2); tctx.fill();
      }

      var glow = tctx.createRadialGradient(x,y,0,x,y,sz);
      glow.addColorStop(0,'rgba('+GT.core+','+op.toFixed(3)+')'); glow.addColorStop(0.4,'rgba('+GT.bright+','+(op*0.5).toFixed(3)+')'); glow.addColorStop(1,'rgba('+GT.core+',0)');
      tctx.beginPath(); tctx.fillStyle=glow; tctx.arc(x,y,sz,0,Math.PI*2); tctx.fill();
      if(sp.flare && op>0.5){
        tctx.save();
        tctx.strokeStyle = 'rgba('+GT.core+','+(op*0.8).toFixed(3)+')';
        tctx.lineWidth = 1;
        tctx.beginPath();
        tctx.moveTo(x-sz*2.2,y); tctx.lineTo(x+sz*2.2,y);
        tctx.moveTo(x,y-sz*2.2); tctx.lineTo(x,y+sz*2.2);
        tctx.stroke();
        tctx.restore();
      }
    });
  }
  if(reduced){ torDraw(0); } else { (function torLoop(t){ torDraw(t); requestAnimationFrame(torLoop); })(0); }
})();
</script>

</body>
</html>
