<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEST</title>
<meta name="description" content="BEST — творческое сообщество каверов и клипов.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070502">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Marck+Script&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070502; --parchment:#cdc2a8; --line:#2b210f; --gold-dim:#8a651f; --gold-bright:#f6dd9a;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
    --word-c1:#fff8d0; --word-c2:#fff1a8; --word-c3:#ffc928; --word-c4:#d99a00; --word-c5:#8a4e00;
    --word-glow1: rgba(255,241,168,0.9); --word-glow2: rgba(255,201,40,0.55); --word-glow3: rgba(217,154,0,0.4);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; background:var(--ink); }
  body{ color:var(--parchment); font-family:ui-sans-serif,system-ui,sans-serif; }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:0.001ms !important; } }

  #app{ position:relative; height:100svh; width:100%; overflow:hidden; }
  .tor-wrap{
    position:absolute; left:50%; top:50%; z-index:0;
    width:min(120vw,120vh); height:min(120vw,120vh);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  canvas.tor-canvas{ width:100%; height:100%; }

  .screen{
    position:absolute; inset:0; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    padding:1.6rem; text-align:center;
  }
  .screen-inner{ position:relative; z-index:2; width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:1.1rem; }

  .logo-stack{ position:relative; display:inline-block; cursor:pointer; }
  /* «зеркальность в буквах» — чередование ярких/тёмных полос (грань полированного металла ловит
     и теряет свет несколько раз), не один плавный переход — тот же приём, что рисует «chrome text» */
  #wordmark{
    position:relative; margin:0;
    transition: opacity 0.16s ease;
    font-family:"Alex Brush", "Marck Script", "Pinyon Script", "Segoe Script", "Brush Script MT", cursive;
    font-weight:400; font-size:clamp(var(--wm-min, 5.4rem), 28vw, var(--wm-max, 12rem)); line-height:1;
    background:linear-gradient(160deg,
      var(--word-c1) 0%, #fffef2 6%, var(--word-c2) 14%,
      var(--word-c4) 27%, #6b3900 36%,
      #fffef2 46%, var(--word-c3) 56%,
      var(--word-c5) 68%, #5a3200 76%,
      #fff6d8 86%, var(--word-c3) 94%, var(--word-c5) 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    -webkit-text-stroke: 0.6px rgba(60,32,0,0.6);
    filter:
      drop-shadow(0 0 3px var(--word-glow1))
      drop-shadow(0 0 16px var(--word-glow2))
      drop-shadow(0 0 34px var(--word-glow3))
      drop-shadow(0 2px 0 rgba(59,33,0,0.65));
    animation: glow-pulse 3.6s ease-in-out infinite;
  }
  #wordmark::after{
    content: attr(data-text);
    position:absolute; inset:0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.95) 48%, rgba(255,255,255,0.95) 52%, transparent 70%);
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    animation: mirror-sweep 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes mirror-sweep{ 0%{ background-position:150% 0; } 55%,100%{ background-position:-50% 0; } }
  @keyframes glow-pulse{
    0%,100%{ filter:
      drop-shadow(0 0 3px rgba(255,241,168,0.9)) drop-shadow(0 0 16px rgba(255,201,40,0.55))
      drop-shadow(0 0 34px rgba(217,154,0,0.4)) drop-shadow(0 2px 0 rgba(59,33,0,0.65)); }
    50%{ filter:
      drop-shadow(0 0 4px rgba(255,241,168,1)) drop-shadow(0 0 24px rgba(255,201,40,0.75))
      drop-shadow(0 0 46px rgba(217,154,0,0.55)) drop-shadow(0 2px 0 rgba(59,33,0,0.65)); }
  }
  @supports not (background-clip: text){
    #wordmark{ color:#ffc928; -webkit-text-fill-color:#ffc928; background:none; }
  }
  .logo-spark{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:#fff8d0; box-shadow:0 0 8px 2px rgba(255,201,40,0.8);
    animation: spark-twinkle 2.4s ease-in-out infinite;
  }
  .logo-spark:nth-child(2){ top:6%; right:8%; animation-delay:0s; }
  .logo-spark:nth-child(3){ bottom:14%; left:4%; animation-delay:0.8s; }
  .logo-spark:nth-child(4){ top:44%; right:-2%; width:4px; height:4px; animation-delay:1.5s; }
  @keyframes spark-twinkle{ 0%,100%{ opacity:0; transform:scale(0.4); } 50%{ opacity:1; transform:scale(1); } }
  @media (prefers-reduced-motion: reduce){
    #wordmark, #wordmark::after{ animation:none; }
    .logo-spark{ animation:none; opacity:0; }
  }

  .tiktok-link{
    display:inline-block; margin-top:0.6rem; font-family:var(--mono); font-size:0.72rem;
    letter-spacing:0.06em; color:var(--gold-dim); text-decoration:none; border:1px solid var(--line);
    border-radius:999px; padding:0.35rem 0.85rem; transition: color .2s ease, border-color .2s ease;
  }
  .tiktok-link:hover, .tiktok-link:focus-visible{ color:var(--gold-bright); border-color:var(--gold-dim); outline:none; }

  /* статичная метка — не кнопка, нельзя нажать, не показывает список изменений */
  .release-tag{
    position:absolute; bottom:0.7rem; left:0; right:0; text-align:center; z-index:5;
    font-family:var(--mono); font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--gold-dim); opacity:0.6; user-select:none;
  }
</style>
</head>
<body>

<div id="app">
  <div class="tor-wrap" aria-hidden="true"><canvas class="tor-canvas" id="torCanvas"></canvas></div>
  <div class="screen">
    <div class="screen-inner">
      <div class="logo-stack" id="logoStack">
        <h1 id="wordmark" data-text="Hit.parad.official">Hit.parad.official</h1>
        <span class="logo-spark" aria-hidden="true"></span>
        <span class="logo-spark" aria-hidden="true"></span>
        <span class="logo-spark" aria-hidden="true"></span>
      </div>
      <a class="tiktok-link" id="tiktokLink" href="#" target="_blank" rel="noopener" style="display:none">↗ TikTok</a>
    </div>
  </div>
  <div class="release-tag">Релиз 2</div>
</div>

<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function seeded(i){ var x = Math.sin(i*12.9898)*43758.5453; return x - Math.floor(x); }

  var torCanvas = document.getElementById('torCanvas');
  var tctx = torCanvas.getContext('2d');
  var tw, th, tdpr = Math.min(window.devicePixelRatio || 1, 2);
  function torResize(){
    tw = torCanvas.parentElement.clientWidth; th = torCanvas.parentElement.clientHeight;
    torCanvas.width = tw*tdpr; torCanvas.height = th*tdpr;
    torCanvas.style.width = tw+'px'; torCanvas.style.height = th+'px';
    tctx.setTransform(tdpr,0,0,tdpr,0,0);
  }
  window.addEventListener('resize', torResize);
  torResize();

  var GT_OUTER = 0.40, GT_INNER = 0.55;
  var GT = { core:'', bright:'', gold:'', amber:'', amberDark:'', bronze:'' };

  // 30 подтверждённых направлений (снимок TOR_COLORS.json на момент публикации) — тап по слову
  // переключает по кругу. Полный список с 40+ направлениями, панелью настроек и API — только в
  // приватном Пульте (control/best-vision.html), эта копия — публичный срез, без служебного.
  var VARIANTS = [
    { word:'Hit.parad.official', ring:{core:'242,240,222',bright:'249,232,118',gold:'253,223,33',amber:'211,184,9',amberDark:'142,125,11',bronze:'65,58,11'}, tiktok:'best.my.stars' },
    { word:'Valmont', ring:{core:'255,225,215',bright:'255,90,90',gold:'230,25,25',amber:'178,14,14',amberDark:'120,8,8',bronze:'50,3,3'}, tiktok:'best.valmont.man' },
    { word:'Animix', ring:{core:'230,222,242',bright:'173,118,249',gold:'124,33,253',amber:'93,9,211',amberDark:'66,11,142',bronze:'34,11,65'}, tiktok:'best.anime.show' },
    { word:'Fovela', ring:{core:'220,220,228',bright:'150,150,160',gold:'95,95,108',amber:'58,58,70',amberDark:'32,32,42',bronze:'10,10,15'}, tiktok:'best_fovela' },
    { word:'Aleorix', ring:{core:'244,221,244',bright:'251,116,251',gold:'253,33,253',amber:'214,5,214',amberDark:'145,8,145',bronze:'67,10,67'}, tiktok:'aleorix0' },
    { word:'Jelly', ring:{core:'255,230,150',bright:'224,178,80',gold:'184,134,11',amber:'139,101,8',amberDark:'92,64,5',bronze:'40,28,2'}, tiktok:'jelly.show' },
    { word:'Vanila', ring:{core:'221,244,234',bright:'116,251,198',gold:'33,253,166',amber:'5,214,131',amberDark:'8,145,91',bronze:'10,67,44'}, tiktok:'best.vanila.show' },
    { word:'Рок', ring:{core:'221,244,243',bright:'116,251,250',gold:'33,253,251',amber:'5,214,212',amberDark:'8,145,144',bronze:'10,67,66'}, tiktok:'best.rock.party' },
    { word:'Tiretok', ring:{core:'221,239,244',bright:'116,226,251',gold:'33,212,253',amber:'5,175,214',amberDark:'8,120,145',bronze:'10,56,67'}, tiktok:'best.tiretok' },
    { word:'Детский', ring:{core:'250,251,255',bright:'236,239,246',gold:'214,217,226',amber:'176,180,192',amberDark:'118,122,134',bronze:'40,40,52'}, tiktok:'best.children.show' },
    { word:'Voice', ring:{core:'221,230,244',bright:'116,174,251',gold:'33,127,253',amber:'5,94,214',amberDark:'8,66,145',bronze:'10,34,67'}, tiktok:'best.voice.show' },
    { word:'Coffee', ring:{core:'221,226,244',bright:'116,147,251',gold:'33,84,253',amber:'5,54,214',amberDark:'8,40,145',bronze:'10,23,67'}, tiktok:'best.coffee.show' },
    { word:'ISR', ring:{core:'221,222,244',bright:'116,121,251',gold:'33,42,253',amber:'5,14,214',amberDark:'8,13,145',bronze:'10,12,67'}, tiktok:'best.isr.show' },
    { word:'Dream', ring:{core:'222,242,229',bright:'118,249,166',gold:'33,253,113',amber:'9,211,83',amberDark:'11,142,59',bronze:'11,65,31'}, tiktok:'best.dream.show' },
    { word:'Dualis', ring:{core:'230,222,242',bright:'173,118,249',gold:'124,33,253',amber:'93,9,211',amberDark:'66,11,142',bronze:'34,11,65'}, tiktok:'best.duet.show' },
    { word:'Zaryum', ring:{core:'233,221,244',bright:'189,116,251',gold:'152,33,253',amber:'118,5,214',amberDark:'82,8,145',bronze:'41,10,67'}, youtube:'https://youtube.com/playlist?list=PLuaNqEUb7SmVnWfr6seNIC_8uMPZSc-Xd&si=qD9XmHhjlJAXmM7o' },
    { word:'Noira', ring:{core:'221,221,244',bright:'116,116,251',gold:'33,33,253',amber:'5,5,214',amberDark:'8,8,145',bronze:'10,10,67'}, youtube:'https://youtube.com/playlist?list=PLuaNqEUb7SmXUdZlHeY4HgbE29TWwfTiW&si=UX7SENnSpwrlf61F' },
    { word:'Nerix', ring:{core:'221,244,221',bright:'116,251,116',gold:'33,253,33',amber:'5,214,5',amberDark:'8,145,8',bronze:'10,67,10'}, tiktok:'best.comedy.show' },
    { word:'Moon', ring:{core:'221,244,221',bright:'116,251,116',gold:'33,253,33',amber:'5,214,5',amberDark:'8,145,8',bronze:'10,67,10'}, tiktok:'best.moon.show' },
    { word:'Grand Show', ring:{core:'244,221,221',bright:'251,116,116',gold:'253,33,33',amber:'214,5,5',amberDark:'145,8,8',bronze:'67,10,10'}, tiktok:'best.grand.show' },
    { word:'Dostar', ring:{core:'244,221,232',bright:'251,116,182',gold:'253,33,141',amber:'214,5,108',amberDark:'145,8,75',bronze:'67,10,38'}, tiktok:'best.dostar.show' },
    { word:'Tune', ring:{core:'244,221,227',bright:'251,116,156',gold:'253,33,98',amber:'214,5,67',amberDark:'145,8,48',bronze:'67,10,27'}, tiktok:'best.tune.show' },
    { word:'Anibrox', ring:{core:'244,221,223',bright:'251,116,130',gold:'253,33,56',amber:'214,5,27',amberDark:'145,8,22',bronze:'67,10,16'}, tiktok:'best.anibrox' },
    { word:'Exclusive Stars', ring:{core:'221,244,221',bright:'116,251,116',gold:'33,253,33',amber:'5,214,5',amberDark:'8,145,8',bronze:'10,67,10'}, tiktok:'best.exclusive.stars' },
    { word:'News', ring:{core:'221,232,244',bright:'116,183,251',gold:'33,142,253',amber:'5,109,214',amberDark:'8,76,145',bronze:'10,38,67'}, tiktok:'best.news.show' },
    { word:'Finger Dance', ring:{core:'244,231,221',bright:'251,180,116',gold:'253,137,33',amber:'214,104,5',amberDark:'145,73,8',bronze:'67,37,10'}, tiktok:'best.finger.dance' },
    { word:'Past Legends', ring:{core:'244,236,221',bright:'251,206,116',gold:'253,180,33',amber:'214,145,5',amberDark:'145,100,8',bronze:'67,48,10'}, tiktok:'best.past.legends' },
    { word:'Arhiv', ring:{core:'244,240,221',bright:'251,233,116',gold:'253,223,33',amber:'214,185,5',amberDark:'145,127,8',bronze:'67,59,10'}, tiktok:'best.arhiv.show' },
    { word:'BestChat', ring:{core:'242,244,221',bright:'243,251,116',gold:'240,253,33',amber:'202,214,5',amberDark:'137,145,8',bronze:'64,67,10'} },
    { word:'BestOfficial', ring:{core:'255,244,176',bright:'255,216,74',gold:'255,179,0',amber:'242,138,0',amberDark:'185,90,0',bronze:'90,38,0'}, tiktok:'best.show.official' }
  ];

  function torSizeWordmark(text){
    var len = Math.max(String(text).length, 1);
    var f = Math.pow(4/len, 0.7);
    var minRem = Math.max(1.6, 5.4*f), maxRem = Math.max(minRem+0.4, 12*f);
    var wm = document.getElementById('wordmark');
    wm.style.setProperty('--wm-min', minRem.toFixed(2)+'rem');
    wm.style.setProperty('--wm-max', maxRem.toFixed(2)+'rem');
  }

  var variantIndex = 0;
  var wmSwapTimer = null;
  function applyVariant(i){
    variantIndex = ((i % VARIANTS.length) + VARIANTS.length) % VARIANTS.length;
    var v = VARIANTS[variantIndex];
    GT.core=v.ring.core; GT.bright=v.ring.bright; GT.gold=v.ring.gold;
    GT.amber=v.ring.amber; GT.amberDark=v.ring.amberDark; GT.bronze=v.ring.bronze;

    var wm = document.getElementById('wordmark');
    wm.style.opacity = '0';
    clearTimeout(wmSwapTimer);
    wmSwapTimer = setTimeout(function(){
      wm.textContent = v.word; wm.setAttribute('data-text', v.word);
      torSizeWordmark(v.word);
      wm.style.opacity = '1';
    }, 160);

    var link = document.getElementById('tiktokLink');
    if(v.youtube){ link.href = v.youtube; link.textContent = '↗ YouTube'; link.style.display = ''; }
    else if(v.tiktok){ link.href = 'https://www.tiktok.com/@'+v.tiktok; link.textContent = '↗ @'+v.tiktok; link.style.display = ''; }
    else { link.style.display = 'none'; }
  }
  applyVariant(0);
  document.getElementById('logoStack').addEventListener('click', function(){
    applyVariant(variantIndex + 1);
  });

  var torStrands = [];
  var STRAND_N = 18;
  for(var si=0; si<STRAND_N; si++){
    var spread = si/(STRAND_N-1);
    torStrands.push({
      pos: 0.5 + (spread - 0.5) * 0.80,
      freq: 3 + Math.floor(seeded(si+7)*3),
      wob: 0.07 + seeded(si+13)*0.11,
      phase: seeded(si+21)*Math.PI*2,
      width: 2.0 + seeded(si+29)*3.4,
      alpha: 0.52 + seeded(si+37)*0.38,
      colorStep: si
    });
  }
  function torStrandColor(step){
    var stops = [GT.core, GT.bright, GT.gold, GT.amber, GT.amberDark, GT.bronze, GT.bronze];
    return stops[step % stops.length];
  }

  // «гостевые» нити — цвета других подтверждённых направлений семьи, тихий акцент поверх золота
  var FAMILY_ACCENT_COLORS = [
    { core:'249,232,118', bright:'253,223,33' },
    { core:'255,225,215', bright:'230,25,25' },
    { core:'230,222,242', bright:'124,33,253' },
    { core:'214,242,220', bright:'0,168,84' },
    { core:'255,230,150', bright:'184,134,11' }
  ];
  var torFamilyStrands = [];
  var FAMILY_N = reduced ? 0 : FAMILY_ACCENT_COLORS.length;
  for(var fi=0; fi<FAMILY_N; fi++){
    torFamilyStrands.push({
      pos: 0.06 + fi*(0.9/(FAMILY_N-1||1)),
      freq: 2 + Math.floor(seeded(fi+200)*3),
      wob: 0.09 + seeded(fi+213)*0.13,
      phase: seeded(fi+221)*Math.PI*2,
      width: 1.1 + seeded(fi+229)*1.1,
      alpha: 0.16 + seeded(fi+237)*0.14,
      color: FAMILY_ACCENT_COLORS[fi]
    });
  }

  var torWisps = [];
  var torWispN = reduced ? 0 : 14;
  for(var wi=0; wi<torWispN; wi++){
    torWisps.push({ angle: seeded(wi+51)*Math.PI*2, len: 0.10+seeded(wi+59)*0.16, curve: 0.4+seeded(wi+67)*0.5, speed: 0.00004+seeded(wi+73)*0.00006 });
  }

  var torSparks = [];
  var torSparkN = reduced ? 0 : 64;
  for(var k=0;k<torSparkN;k++){
    torSparks.push({ a: seeded(k*3+1)*Math.PI*2, rOff: seeded(k*3+2), speed: 0.0006+seeded(k*3+3)*0.0009, tw: seeded(k*3+4)*Math.PI*2, size: 2.6+seeded(k*3+5)*3.2, flare: (k%8===0) });
  }

  function torDraw(t){
    tctx.clearRect(0,0,tw,th);
    var cx=tw/2, cy=th/2, minDim = Math.min(tw,th);
    var outerR = minDim*GT_OUTER, innerR = outerR*GT_INNER;
    var bandHalf = (outerR-innerR)/2;
    var rotT = t*0.00031;

    var blx = cx - outerR*0.30, bly = cy - outerR*0.40;
    var bloom = tctx.createRadialGradient(blx,bly,0, blx,bly, outerR*0.55);
    bloom.addColorStop(0,'rgba('+GT.core+',0.38)'); bloom.addColorStop(1,'rgba('+GT.core+',0)');
    tctx.fillStyle = bloom; tctx.beginPath(); tctx.arc(blx,bly,outerR*0.55,0,Math.PI*2); tctx.fill();

    tctx.save();
    tctx.strokeStyle = 'rgba('+GT.bright+',0.16)';
    tctx.lineWidth = 1.1;
    tctx.beginPath();
    tctx.arc(cx, cy, innerR+bandHalf, 0, Math.PI*2);
    tctx.stroke();
    tctx.restore();

    torStrands.forEach(function(s){
      var segs = 110;
      var r0 = innerR + bandHalf*2*s.pos;
      var taper = 1.12 - s.pos*0.7;
      var tw_ = s.width*taper, ta_ = s.alpha*taper;
      tctx.beginPath();
      for(var seg=0; seg<=segs; seg++){
        var ang = (seg/segs)*Math.PI*2;
        var wob = Math.sin(ang*s.freq + s.phase + rotT) * bandHalf * s.wob;
        var r = r0 + wob;
        var x = cx + Math.cos(ang)*r, y = cy + Math.sin(ang)*r*0.985;
        if(seg===0) tctx.moveTo(x,y); else tctx.lineTo(x,y);
      }
      tctx.save();
      tctx.shadowColor = 'rgba('+GT.bright+',0.55)';
      tctx.shadowBlur = 3;
      tctx.strokeStyle = 'rgba('+torStrandColor(s.colorStep)+','+(ta_*0.35).toFixed(3)+')';
      tctx.lineWidth = tw_*2.6;
      tctx.stroke();
      tctx.restore();

      tctx.save();
      tctx.globalCompositeOperation = 'lighter';
      tctx.shadowColor = 'rgba('+GT.bright+',0.9)';
      tctx.shadowBlur = 13;
      tctx.strokeStyle = 'rgba('+torStrandColor(s.colorStep)+','+ta_.toFixed(3)+')';
      tctx.lineWidth = tw_;
      tctx.stroke();
      tctx.restore();

      var shine = (0.10 + 0.22*Math.max(0, Math.sin(t*0.0009 + s.phase*1.7))) * taper;
      tctx.save();
      tctx.shadowColor = 'rgba('+GT.core+',0.95)';
      tctx.shadowBlur = 10;
      tctx.strokeStyle = 'rgba('+GT.core+','+shine.toFixed(3)+')';
      tctx.lineWidth = tw_*0.45;
      tctx.stroke();
      tctx.restore();
    });

    torFamilyStrands.forEach(function(s){
      var segs = 90;
      var r0 = innerR + bandHalf*2*s.pos;
      tctx.beginPath();
      for(var seg=0; seg<=segs; seg++){
        var ang = (seg/segs)*Math.PI*2;
        var wob = Math.sin(ang*s.freq + s.phase + rotT*0.7) * bandHalf * s.wob;
        var r = r0 + wob;
        var x = cx + Math.cos(ang)*r, y = cy + Math.sin(ang)*r*0.985;
        if(seg===0) tctx.moveTo(x,y); else tctx.lineTo(x,y);
      }
      tctx.save();
      tctx.globalCompositeOperation = 'lighter';
      tctx.shadowColor = 'rgba('+s.color.bright+',0.5)';
      tctx.shadowBlur = 6;
      tctx.strokeStyle = 'rgba('+s.color.bright+','+s.alpha.toFixed(3)+')';
      tctx.lineWidth = s.width;
      tctx.stroke();
      tctx.restore();
    });

    torWisps.forEach(function(wsp){
      var ang = wsp.angle + t*wsp.speed;
      var r0 = outerR*0.99, r1 = outerR*(1+wsp.len), ang1 = ang + wsp.curve;
      var x0 = cx+Math.cos(ang)*r0, y0 = cy+Math.sin(ang)*r0*0.985;
      var x1 = cx+Math.cos(ang1)*r1, y1 = cy+Math.sin(ang1)*r1*0.985;
      var midAng=(ang+ang1)/2, midR=(r0+r1)/2*1.04;
      var mx=cx+Math.cos(midAng)*midR, my=cy+Math.sin(midAng)*midR*0.985;
      var grad = tctx.createLinearGradient(x0,y0,x1,y1);
      grad.addColorStop(0,'rgba('+GT.bright+',0.4)'); grad.addColorStop(1,'rgba('+GT.bright+',0)');
      tctx.beginPath(); tctx.moveTo(x0,y0); tctx.quadraticCurveTo(mx,my,x1,y1);
      tctx.strokeStyle = grad; tctx.lineWidth = 1.1; tctx.stroke();
    });

    torSparks.forEach(function(sp){
      sp.a += sp.speed;
      var r = innerR + bandHalf*2*sp.rOff;
      var x = cx+Math.cos(sp.a)*r, y = cy+Math.sin(sp.a)*r*0.98;
      var op = 0.48 + 0.52*Math.max(0, Math.sin(t*0.0016 + sp.tw));
      var sz = sp.flare ? sp.size*1.8 : sp.size;

      var trailN = 4;
      for(var ti=trailN; ti>=1; ti--){
        var ta = sp.a - sp.speed*ti*3.4;
        var tx = cx+Math.cos(ta)*r, ty = cy+Math.sin(ta)*r*0.98;
        var talpha = op * (1 - ti/(trailN+1)) * 0.4;
        tctx.beginPath(); tctx.fillStyle = 'rgba('+GT.bright+','+talpha.toFixed(3)+')';
        tctx.arc(tx, ty, sz*0.42, 0, Math.PI*2); tctx.fill();
      }

      var glow = tctx.createRadialGradient(x,y,0,x,y,sz);
      glow.addColorStop(0,'rgba('+GT.core+','+op.toFixed(3)+')'); glow.addColorStop(0.4,'rgba('+GT.bright+','+(op*0.5).toFixed(3)+')'); glow.addColorStop(1,'rgba('+GT.core+',0)');
      tctx.beginPath(); tctx.fillStyle=glow; tctx.arc(x,y,sz,0,Math.PI*2); tctx.fill();
      if(sp.flare && op>0.5){
        tctx.save();
        tctx.strokeStyle = 'rgba('+GT.core+','+(op*0.8).toFixed(3)+')';
        tctx.lineWidth = 1;
        tctx.beginPath();
        tctx.moveTo(x-sz*2.2,y); tctx.lineTo(x+sz*2.2,y);
        tctx.moveTo(x,y-sz*2.2); tctx.lineTo(x,y+sz*2.2);
        tctx.stroke();
        tctx.restore();
      }
    });
  }
  if(reduced){ torDraw(0); } else { (function torLoop(t){ torDraw(t); requestAnimationFrame(torLoop); })(0); }
})();
</script>
